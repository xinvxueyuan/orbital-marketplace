# Dependabot 依赖更新配置
# 参见 https://docs.github.com/en/code-security/dependabot/dependabot-version-updates/configuration-options-for-the-dependabot.yml-file

version: 2
updates:
  # 前端 npm 依赖（根目录）
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 10
    commit-message:
      prefix: "⬆️ build(deps)"
      include: "scope"
    labels:
      - "dependencies"
      - "npm"
    groups:
      # 将 patch/minor 升级合并为单个 PR，减少噪音
      npm-patch-and-minor:
        update-types:
          - "patch"
          - "minor"

  # 后端 pip 依赖（backend 目录）
  - package-ecosystem: "pip"
    directory: "/backend"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 10
    commit-message:
      prefix: "⬆️ build(deps)"
      include: "scope"
    labels:
      - "dependencies"
      - "pip"

  # GitHub Actions 工作流依赖（.github/workflows 目录）
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 5
    commit-message:
      prefix: "⬆️ build(deps)"
      include: "scope"
    labels:
      - "dependencies"
      - "github-actions"
