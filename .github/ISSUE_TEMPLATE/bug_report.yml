name: 🐛 Bug 报告
description: Orbital 中存在异常行为或功能无法正常使用时，请使用此模板
title: "[Bug]: "
labels: ["bug", "triage"]
body:
  - type: markdown
    attributes:
      value: |
        感谢你抽出时间提交 Bug 报告！
        请填写必填项，以便我们快速复现并修复。
        各字段均可使用中文填写。
  - type: input
    id: title
    attributes:
      label: 简短标题
      description: 用 1-2 句话概括该 Bug。
      placeholder: "例如：发卡页兑换卡密后状态未变为 redeemed"
    validations:
      required: true
  - type: dropdown
    id: severity
    attributes:
      label: 严重程度
      description: 该 Bug 对你使用的影响有多大？
      options:
        - 阻断 — 核心流程不可用或后端无法启动
        - 严重 — 功能损坏，无规避方法
        - 轻微 — 功能损坏，有规避方法
        - 外观 — 视觉 / 日志问题，无功能影响
      default: 2
    validations:
      required: true
  - type: dropdown
    id: component
    attributes:
      label: 受影响组件
      description: 选择最接近的一项，无匹配请选「其他」。
      options:
        - 前端 — 发现 / 浏览
        - 前端 — 应用详情
        - 前端 — 订阅 / 更新
        - 前端 — 资料库
        - 前端 — 发卡
        - 前端 — 文档站
        - 前端 — 路由 / 过渡动画
        - 后端 — apps 接口
        - 后端 — cards 发卡接口
        - 后端 — orders 接口
        - 后端 — library 接口
        - 后端 — docs 接口
        - 后端 — 数据库 / ORM
        - 后端 — 配置 / CORS
        - CI / 构建 / 发布
        - Docker
        - 其他
      default: 16
    validations:
      required: true
  - type: textarea
    id: description
    attributes:
      label: Bug 描述
      description: 发生了什么？你期望发生什么？
      placeholder: "清晰描述该 Bug。"
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: 复现步骤
      description: 一步步说明如何复现该行为。
      placeholder: |
        1. 进入「发卡」页
        2. 点击「兑换」
        3. 观察到 '...'
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: 期望行为
      description: 你期望发生什么。
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: 实际行为
      description: 实际发生了什么。如有报错信息、堆栈或截图请附上。
    validations:
      required: true
  - type: input
    id: os
    attributes:
      label: 操作系统
      placeholder: "例如 Ubuntu 24.04、Windows 11、macOS 14"
    validations:
      required: true
  - type: input
    id: browser
    attributes:
      label: 浏览器（如涉及前端）
      placeholder: "例如 Chrome 126、Firefox 127、Safari 17"
  - type: input
    id: node-version
    attributes:
      label: Node.js 版本
      placeholder: "例如 20.14.0"
  - type: input
    id: python-version
    attributes:
      label: Python 版本
      placeholder: "例如 3.11.9"
    validations:
      required: true
  - type: input
    id: orbital-version
    attributes:
      label: Orbital 版本
      description: 如适用，填写 commit SHA 或 tag。
      placeholder: "例如 1.0.0 / commit abc123"
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: 日志
      description: 相关日志输出。直接粘贴即可，GitHub 会自动格式化为代码块。请隐去密钥、Token 与个人标识。
      render: shell
  - type: textarea
    id: context
    attributes:
      label: 补充信息
      description: 其他评审者需要了解的内容 — 已尝试的规避方法、相关 issue、截图等。
