name: 🧹 Clear workflow runs
on:
  schedule:
    - cron: "0 3 * * 0"
  workflow_dispatch:
permissions:
  actions: write
  contents: read
jobs:
  clean:
    name: 🧹 Remove old workflow runs
    runs-on: ubuntu-latest
    steps:
      - name: 🧹 Remove expired workflow runs
        uses: Mattraks/remove-workflow-runs@v2
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          retain_days: 30
          keep_minimum_runs: 6
          delete_workflow_pattern: "🧪-frontend.yml,🧪-python.yml,👷-ci-builds.yml"
