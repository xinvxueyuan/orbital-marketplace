name: 👷 CI-builds
on:
  workflow_dispatch:
  pull_request:
    branches: [main]
  push:
    branches: [main]
permissions:
  contents: read
concurrency:
  group: ci-builds-${{ github.ref }}
  cancel-in-progress: true
jobs:
  frontend-build:
    name: 📦 Frontend build
    runs-on: ubuntu-latest
    steps:
      - name: 📥 Checkout
        uses: actions/checkout@v4

      - name: ⚡ Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: 📦 Install dependencies
        run: npm ci

      - name: 🏗️ Build frontend
        run: npm run build

      - name: 📤 Upload dist artifact
        uses: actions/upload-artifact@v4
        with:
          name: frontend-dist
          path: dist
          retention-days: 7

  backend-test:
    name: 🐍 Backend smoke test
    runs-on: ubuntu-latest
    steps:
      - name: 📥 Checkout
        uses: actions/checkout@v4

      - name: 🐍 Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: 📦 Install dependencies
        run: pip install -r backend/requirements.txt

      - name: 🌱 Seed database
        run: python -m backend.seed

      - name: 🚀 Start API server
        run: uvicorn backend.app.main:app --host 127.0.0.1 --port 8000 &

      - name: ⏳ Wait for server
        run: |
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:8000/api/v1/health >/dev/null 2>&1; then
              echo "server is up"
              exit 0
            fi
            sleep 1
          done
          echo "server did not start in time" >&2
          exit 1

      - name: 🧪 Smoke test API
        run: |
          set -e
          echo "== health =="
          curl -fsS http://127.0.0.1:8000/api/v1/health

          echo "== apps =="
          curl -fsS 'http://127.0.0.1:8000/api/v1/apps' | head -c 200
          echo

          echo "== cards (available) =="
          curl -fsS 'http://127.0.0.1:8000/api/v1/cards?status=available' | head -c 200
          echo

          echo "== auto-issue =="
          AUTO=$(curl -fsS -X POST http://127.0.0.1:8000/api/v1/cards/auto-issue \
            -H 'Content-Type: application/json' \
            -d '{"appId":"nova-studio","planId":"pro","type":"subscription","price":12,"buyer":"ci@orbital.dev"}')
          echo "$AUTO" | head -c 300
          echo

          echo "== redeem =="
          CODE=$(echo "$AUTO" | jq -r '.card.code')
          curl -fsS -X POST http://127.0.0.1:8000/api/v1/cards/redeem \
            -H 'Content-Type: application/json' \
            -d "{\"code\": \"$CODE\"}"

      - name: 🛑 Stop server
        if: always()
        run: pkill -f 'uvicorn backend.app.main:app' || true
