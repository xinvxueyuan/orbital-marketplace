name: 🧪 Frontend CI
on:
  workflow_dispatch:
  pull_request:
    branches: [main]
    paths:
      - "src/**"
      - "public/**"
      - "index.html"
      - "vite.config.js"
      - "tailwind.config.js"
      - "postcss.config.js"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/🧪-frontend.yml"
  push:
    branches: [main]
    paths:
      - "src/**"
      - "public/**"
      - "index.html"
      - "vite.config.js"
      - "tailwind.config.js"
      - "postcss.config.js"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/🧪-frontend.yml"
permissions:
  contents: read
concurrency:
  group: frontend-ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    name: 📦 Build
    runs-on: ubuntu-latest
    steps:
      - name: 📥 Checkout
        uses: actions/checkout@v7

      - name: ⚡ Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: 📦 Install dependencies
        run: npm ci

      - name: 🏗️ Build
        run: npm run build

      - name: 📤 Upload dist artifact
        uses: actions/upload-artifact@v7
        with:
          name: frontend-dist
          path: dist
          retention-days: 7
